{% extends "base.html" %}

{% block content %}
<div style="max-width: 800px; margin: 2rem auto; padding: 0 1rem;">
    
    <!-- Header with icon -->
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-size: 3rem; color: #fbbf24; margin-bottom: 1rem;">
            <i class="fas fa-{% block icon %}file-contract{% endblock %}"></i>
        </div>
        <h1 style="color: white; font-size: 2.2rem;">{% block title %}{% endblock %}</h1>
        <p style="color: #94a3b8;">Last updated: February 2025</p>
    </div>
    
    <!-- Content card -->
    <div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2.5rem;">
        <div style="color: #e2e8f0; line-height: 1.7;">
            {% block legal_content %}{% endblock %}
        </div>
    </div>
    
    <!-- Back button -->
    <div style="text-align: center; margin-top: 2rem;">
        <a href="/" style="color: #0cc0df; text-decoration: none;">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>
</div>

<style>
    /* Style headings inside legal pages */
    .legal-content h2 {
        color: white;
        font-size: 1.5rem;
        margin: 2rem 0 1rem;
        border-bottom: 1px solid #334155;
        padding-bottom: 0.5rem;
    }
    
    .legal-content h3 {
        color: #0cc0df;
        font-size: 1.2rem;
        margin: 1.5rem 0 0.5rem;
    }
    
    .legal-content p {
        margin-bottom: 1rem;
    }
    
    .legal-content ul, .legal-content ol {
        margin: 1rem 0;
        padding-left: 1.5rem;
    }
    
    .legal-content li {
        color: #94a3b8;
        margin-bottom: 0.25rem;
    }
    
    .legal-content strong {
        color: white;
    }
    
    .legal-content a {
        color: #0cc0df;
        text-decoration: none;
    }
    
    .legal-content a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}
