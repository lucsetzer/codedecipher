{% extends "base.html" %}

{% block title %}Check Your Email - CodeDecipher{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 4rem auto; text-align: center;">
    <i class="fas fa-envelope" style="font-size: 4rem; color: #fbbf24; margin-bottom: 1rem;"></i>
    <h1 style="color: white; margin-bottom: 1rem;">Check Your Email</h1>
    <p style="color: #94a3b8; margin-bottom: 2rem;">
        We've sent a magic link to <strong>{{ email }}</strong>. Click the link to log in.
    </p>
    <p style="color: #64748b; font-size: 0.9rem;">
        Didn't receive it? <a href="/login" style="color: #0cc0df;">Try again</a>
    </p>
</div>
{% endblock %}
